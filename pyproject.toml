[project]
name = "speedtesttrackerapi"
version = "0.1.2"
description = "A Package for getting data from the Speedtest Tarcker API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datetime>=6.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "typing>=3.10.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]
