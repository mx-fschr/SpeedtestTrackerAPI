[project]
name = "speedtesttrackerapi"
version = "0.1.3"
description = "A modern, type-safe Python API wrapper for the self-hosted Speedtest Tracker. Built with uv and Pydantic v2, it features full IDE auto-completion, built-in validation and secure SSL control. An unofficial community project for seamless automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datetime>=6.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "typing>=3.10.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]
